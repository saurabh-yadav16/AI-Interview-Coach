version: '3.8'

services:
  # 1. MongoDB Database Service
  mongodb:
    image: mongo:latest
    container_name: ai_interview_coach_db
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Express Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_interview_coach_backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/ai_interview_coach
      - JWT_SECRET=prod_jwt_secret_ai_interview_coach_key_987654321
    depends_on:
      mongodb:
        condition: service_healthy

  # 3. Frontend Web Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_interview_coach_frontend
    restart: always
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  mongo_data:
